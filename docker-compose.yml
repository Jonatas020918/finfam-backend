name: finfam

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finfam
      POSTGRES_PASSWORD: finfam
      POSTGRES_DB: finfam
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finfam"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://finfam:finfam@db:5432/finfam
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: dev
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://finfam:finfam@db:5432/finfam
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - api
      - redis

  beat:
    build:
      context: .
      target: dev
    # Agenda o relatório educacional mensal (config/celery.py).
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://finfam:finfam@db:5432/finfam
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis

volumes:
  pgdata:
  media:
