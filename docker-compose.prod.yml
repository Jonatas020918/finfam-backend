# Stack de produção.
#
# O docker-compose.yml ao lado é de desenvolvimento: sobe com `target: dev` e
# `runserver`, que é um processo só, sem concorrência real, recarregando a cada
# arquivo tocado. Este arquivo usa a imagem `base`, que roda gunicorn com três
# trabalhadores e já traz os estáticos coletados.
#
# Subir:
#
#     docker compose -f docker-compose.prod.yml up -d --build
#
# Antes de subir, confira a configuração — o check trava se algo estiver
# incoerente (e-mail no console, ALLOWED_HOSTS com curinga, estáticos ausentes):
#
#     docker compose -f docker-compose.prod.yml run --rm api python manage.py check --deploy
#
# O `.env` deste diretório é a única fonte de segredos. Use o
# .env.producao.exemplo como ponto de partida.

name: finfam

services:
  # --- Porta de entrada -----------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # As aspas não são estilo: sem elas, o "ex.:" da mensagem seria lido pelo
      # YAML como início de um novo mapeamento, e o arquivo inteiro deixa de
      # carregar. Vale para qualquer valor que contenha dois-pontos e espaço.
      DOMINIO: "${DOMINIO:?defina DOMINIO no .env, por exemplo batimento.com.br}"
      EMAIL_ACME: "${EMAIL_ACME:?defina EMAIL_ACME no .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados moram aqui. Perder este volume significa pedir tudo de
      # novo à Let's Encrypt, que tem limite de emissões por semana.
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  # --- Aplicação web (SPA + roteamento) -------------------------------------
  web:
    build:
      context: ../finfam-frontend
    restart: unless-stopped
    # Sem `ports`: quem fala com a internet é o Caddy.
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-finfam}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}"
      POSTGRES_DB: "${POSTGRES_DB:-finfam}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Sem `ports`: o banco só é alcançável pela rede interna do compose.
    # Publicar 5432 na internet é o jeito mais rápido de perder a base.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finfam}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: base
    restart: unless-stopped
    # As migrações rodam antes do gunicorn, e o check --deploy antes das duas:
    # subir com configuração incoerente é pior que não subir.
    command: >
      sh -c "python manage.py check --deploy --fail-level ERROR &&
             python manage.py migrate --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers ${GUNICORN_WORKERS:-3}
               --timeout 120
               --access-logfile -
               --error-logfile -"
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-finfam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finfam}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: base
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 2
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-finfam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finfam}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
    volumes:
      - media:/app/media
    depends_on:
      - api

  beat:
    build:
      context: .
      target: base
    restart: unless-stopped
    # É o beat que dispara a atualização dos indicadores do Banco Central e o
    # encerramento diário de testes e carências vencidos.
    command: celery -A config beat -l info
    env_file: .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-finfam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-finfam}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  media:
  # Certificados e estado interno do Caddy. Sem estes dois, cada `up` pediria
  # certificado novo à Let's Encrypt — que limita emissões por semana e
  # deixaria o site sem HTTPS até a janela reabrir.
  caddydata:
  caddyconfig:
